spring.application.name=task-management-app
spring.jackson.deserialization.accept-float-as-int=false
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_management}
spring.datasource.username=${POSTGRES_USER:task_management}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=task_management

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.web.resources.add-mappings=false

identity.jwt-key-base64=${JWT_SIGNING_KEY_BASE64:}
identity.refresh-days=7

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
attachment.storage-dir=${ATTACHMENT_STORAGE_DIR:${java.io.tmpdir}/projectflow-attachments}
attachment.storage=${ATTACHMENT_STORAGE:local}
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:}
dropbox.app-key=${DROPBOX_APP_KEY:}
dropbox.app-secret=${DROPBOX_APP_SECRET:}
dropbox.app-folder=${DROPBOX_APP_FOLDER:/projectflow}
dropbox.mode=${DROPBOX_MODE:app}
dropbox.team-folder=${DROPBOX_TEAM_FOLDER:}
dropbox.oauth-redirect-uri=${DROPBOX_OAUTH_REDIRECT_URI:}
dropbox.credential-key-base64=${DROPBOX_CREDENTIAL_KEY_BASE64:}

mega.enabled=${MEGA_ENABLED:false}
mega.app-key=${MEGA_APP_KEY:}
mega.session-key-base64=${MEGA_SESSION_KEY_BASE64:}
mega.executable=${MEGA_EXECUTABLE:/usr/local/bin/projectflow-mega}
mega.timeout-seconds=${MEGA_TIMEOUT_SECONDS:120}

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.app-public-base=${APP_PUBLIC_BASE:}

# Set SPRING_MAIL_HOST (and optional SPRING_MAIL_*) only when SMTP is configured;
# an empty spring.mail.host still creates JavaMailSender and breaks readiness.
mail.from=${MAIL_FROM:}
mail.app-public-base=${APP_PUBLIC_BASE:}
mail.brand-name=${MAIL_BRAND_NAME:ProjectFlow}
mail.theme=${MAIL_THEME:default}
mail.digest.cron=${MAIL_DIGEST_CRON:0 0 8 * * *}
