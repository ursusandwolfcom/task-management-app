spring.application.name=task-management-app
spring.jackson.deserialization.accept-float-as-int=false
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:task_management}
spring.datasource.username=${POSTGRES_USER:task_management}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=task_management

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.web.resources.add-mappings=false

identity.jwt-key-base64=${JWT_SIGNING_KEY_BASE64:}
identity.refresh-days=7

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
attachment.storage-dir=${ATTACHMENT_STORAGE_DIR:${java.io.tmpdir}/projectflow-attachments}

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.bot-username=${TELEGRAM_BOT_USERNAME:}
telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.app-public-base=${APP_PUBLIC_BASE:}

# Set SPRING_MAIL_HOST (and optional SPRING_MAIL_*) only when SMTP is configured;
# an empty spring.mail.host still creates JavaMailSender and breaks readiness.
mail.from=${MAIL_FROM:}
mail.app-public-base=${APP_PUBLIC_BASE:}
