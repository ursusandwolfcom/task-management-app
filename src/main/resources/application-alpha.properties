# Explicit local prototype; identity API is separate from browser-stored tasks.
server.address=127.0.0.1
spring.jackson.deserialization.accept-float-as-int=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.paths-to-match=/alpha/plan,/api/**,/users/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=alpha
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=identity
springdoc.swagger-ui.urls[1].url=/v3/api-docs/identity
springdoc.swagger-ui.urls[2].name=projects
springdoc.swagger-ui.urls[2].url=/v3/api-docs/projects
springdoc.swagger-ui.urls[3].name=assignment
springdoc.swagger-ui.urls[3].url=/v3/api-docs/assignment
springdoc.swagger-ui.urls-primary-name=alpha
