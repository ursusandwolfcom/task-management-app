databaseChangeLog:
  - changeSet:
      id: 018-create-task-time-entries
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.task_time_entries (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                user_id BIGINT NOT NULL REFERENCES task_management.users(id),
                work_date DATE NOT NULL,
                minutes INTEGER NOT NULL,
                note VARCHAR(500),
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT task_time_entries_task_fk FOREIGN KEY (project_id, task_id)
                  REFERENCES task_management.tasks(project_id, id) ON DELETE CASCADE,
                CONSTRAINT task_time_entries_minutes_check CHECK (minutes >= 1 AND minutes <= 1440)
              );
              CREATE INDEX task_time_entries_task_idx ON task_management.task_time_entries(task_id, work_date DESC, id DESC);
      rollback:
        - sql:
            sql: DROP TABLE task_management.task_time_entries;
