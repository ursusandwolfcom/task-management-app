databaseChangeLog:
  - changeSet:
      id: 023-protect-dropbox-credentials
      author: task-management
      changes:
        - sql:
            sql: |
              ALTER TABLE task_management.users
                ADD COLUMN dropbox_encrypted_refresh_token VARCHAR(4096) NULL;
              UPDATE task_management.users
                SET dropbox_account_id = NULL, dropbox_linked_at = NULL, version = version + 1
                WHERE dropbox_refresh_token IS NOT NULL
                  OR dropbox_account_id IS NOT NULL OR dropbox_linked_at IS NOT NULL;
              ALTER TABLE task_management.users DROP COLUMN dropbox_refresh_token;
      rollback:
        - sql:
            sql: |
              ALTER TABLE task_management.users ADD COLUMN dropbox_refresh_token VARCHAR(512) NULL;
              UPDATE task_management.users
                SET dropbox_account_id = NULL, dropbox_linked_at = NULL, version = version + 1
                WHERE dropbox_encrypted_refresh_token IS NOT NULL
                  OR dropbox_account_id IS NOT NULL OR dropbox_linked_at IS NOT NULL;
              ALTER TABLE task_management.users DROP COLUMN dropbox_encrypted_refresh_token;
