databaseChangeLog:
  - changeSet:
      id: 003-create-projects
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.projects (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                name VARCHAR(200) NOT NULL,
                description VARCHAR(10000) NOT NULL DEFAULT '',
                start_date DATE NOT NULL,
                end_date DATE NOT NULL,
                timezone VARCHAR(64) NOT NULL DEFAULT 'UTC',
                status VARCHAR(20) NOT NULL DEFAULT 'INITIATED',
                owner_id BIGINT NOT NULL REFERENCES task_management.users(id),
                version BIGINT NOT NULL DEFAULT 0,
                input_revision BIGINT NOT NULL DEFAULT 0,
                calendar_revision BIGINT NOT NULL DEFAULT 0,
                CONSTRAINT projects_name_check CHECK (LENGTH(TRIM(name)) > 0),
                CONSTRAINT projects_dates_check CHECK (end_date >= start_date),
                CONSTRAINT projects_status_check CHECK (status IN ('INITIATED', 'IN_PROGRESS', 'COMPLETED')),
                CONSTRAINT projects_revision_check CHECK (
                  version >= 0 AND input_revision >= 0 AND calendar_revision >= 0)
              );
              CREATE INDEX projects_owner_idx ON task_management.projects(owner_id);
              CREATE TABLE task_management.project_members (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL REFERENCES task_management.projects(id) ON DELETE CASCADE,
                user_id BIGINT NOT NULL REFERENCES task_management.users(id),
                CONSTRAINT project_members_unique UNIQUE (project_id, user_id)
              );
              CREATE INDEX project_members_user_idx ON task_management.project_members(user_id, project_id);
      rollback:
        - sql:
            sql: |
              DROP TABLE task_management.project_members;
              DROP TABLE task_management.projects;
