databaseChangeLog:
  - changeSet:
      id: 007-create-labels
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.labels (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL REFERENCES task_management.projects(id) ON DELETE CASCADE,
                name VARCHAR(100) NOT NULL,
                name_key VARCHAR(300) NOT NULL,
                color VARCHAR(7) NOT NULL,
                version BIGINT NOT NULL DEFAULT 0,
                CONSTRAINT labels_project_id_unique UNIQUE (project_id, id),
                CONSTRAINT labels_project_name_unique UNIQUE (project_id, name_key),
                CONSTRAINT labels_name_check CHECK (LENGTH(TRIM(name)) > 0),
                CONSTRAINT labels_color_check CHECK (LENGTH(color) = 7 AND SUBSTRING(color, 1, 1) = '#'),
                CONSTRAINT labels_version_check CHECK (version >= 0)
              );
              CREATE TABLE task_management.task_labels (
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                label_id BIGINT NOT NULL,
                PRIMARY KEY (task_id, label_id),
                CONSTRAINT task_labels_task_fk FOREIGN KEY (project_id, task_id)
                  REFERENCES task_management.tasks(project_id, id) ON DELETE CASCADE,
                CONSTRAINT task_labels_label_fk FOREIGN KEY (project_id, label_id)
                  REFERENCES task_management.labels(project_id, id) ON DELETE CASCADE
              );
              CREATE INDEX task_labels_label_idx ON task_management.task_labels(label_id);
      rollback:
        - sql:
            sql: |
              DROP TABLE task_management.task_labels;
              DROP TABLE task_management.labels;
