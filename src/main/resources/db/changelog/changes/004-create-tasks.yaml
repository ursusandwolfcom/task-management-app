databaseChangeLog:
  - changeSet:
      id: 004-create-tasks
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.tasks (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL REFERENCES task_management.projects(id),
                name VARCHAR(200) NOT NULL,
                description VARCHAR(10000) NOT NULL DEFAULT '',
                priority VARCHAR(20) NOT NULL,
                estimated_minutes INTEGER,
                due_date DATE,
                assignee_id BIGINT,
                status VARCHAR(20) NOT NULL DEFAULT 'NOT_STARTED',
                actual_start TIMESTAMP WITH TIME ZONE,
                actual_end TIMESTAMP WITH TIME ZONE,
                attempt_count INTEGER NOT NULL DEFAULT 0,
                version BIGINT NOT NULL DEFAULT 0,
                CONSTRAINT tasks_project_id_unique UNIQUE (project_id, id),
                CONSTRAINT tasks_assignee_member_fk FOREIGN KEY (project_id, assignee_id)
                  REFERENCES task_management.project_members(project_id, user_id),
                CONSTRAINT tasks_name_check CHECK (LENGTH(TRIM(name)) > 0),
                CONSTRAINT tasks_priority_check CHECK (priority IN ('LOW', 'MEDIUM', 'HIGH', 'CRITICAL')),
                CONSTRAINT tasks_estimate_check CHECK (estimated_minutes BETWEEN 15 AND 525600),
                CONSTRAINT tasks_status_check CHECK (
                  status IN ('NOT_STARTED', 'IN_PROGRESS', 'COMPLETED', 'FAILED', 'CANCELLED')),
                CONSTRAINT tasks_revision_check CHECK (version >= 0 AND attempt_count >= 0),
                CONSTRAINT tasks_actual_dates_check CHECK (actual_end IS NULL OR
                  (actual_start IS NOT NULL AND actual_end >= actual_start))
              );
              CREATE INDEX tasks_assignee_idx ON task_management.tasks(project_id, assignee_id);
              CREATE TABLE task_management.task_execution_attempts (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                task_id BIGINT NOT NULL REFERENCES task_management.tasks(id),
                attempt_number INTEGER NOT NULL,
                actual_start TIMESTAMP WITH TIME ZONE NOT NULL,
                actual_end TIMESTAMP WITH TIME ZONE,
                outcome VARCHAR(20),
                CONSTRAINT attempts_number_unique UNIQUE (task_id, attempt_number),
                CONSTRAINT attempts_number_check CHECK (attempt_number > 0),
                CONSTRAINT attempts_outcome_check CHECK (
                  (actual_end IS NULL AND outcome IS NULL) OR
                  (actual_end IS NOT NULL AND outcome IS NOT NULL AND actual_end >= actual_start
                  AND outcome IN ('COMPLETED', 'FAILED', 'CANCELLED')))
              );
              CREATE TABLE task_management.task_dependencies (
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                depends_on_task_id BIGINT NOT NULL,
                PRIMARY KEY (task_id, depends_on_task_id),
                CONSTRAINT dependencies_task_fk FOREIGN KEY (project_id, task_id)
                  REFERENCES task_management.tasks(project_id, id),
                CONSTRAINT dependencies_predecessor_fk FOREIGN KEY (project_id, depends_on_task_id)
                  REFERENCES task_management.tasks(project_id, id),
                CONSTRAINT dependencies_self_check CHECK (task_id <> depends_on_task_id)
              );
              CREATE INDEX dependencies_predecessor_idx ON task_management.task_dependencies(depends_on_task_id);
      rollback:
        - sql:
            sql: |
              DROP TABLE task_management.task_dependencies;
              DROP TABLE task_management.task_execution_attempts;
              DROP TABLE task_management.tasks;
