databaseChangeLog:
  - changeSet:
      id: 008-task-bucket
      author: task-management
      changes:
        - sql:
            sql: |
              ALTER TABLE task_management.tasks
                ADD COLUMN bucket VARCHAR(20) NOT NULL DEFAULT 'WORK';
              ALTER TABLE task_management.tasks
                ADD CONSTRAINT tasks_bucket_check CHECK (
                  bucket IN ('INBOX', 'INCUBATOR', 'WORK', 'ARCHIVE'));
              CREATE INDEX tasks_project_bucket_idx ON task_management.tasks(project_id, bucket);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS task_management.tasks_project_bucket_idx;
              ALTER TABLE task_management.tasks DROP CONSTRAINT IF EXISTS tasks_bucket_check;
              ALTER TABLE task_management.tasks DROP COLUMN IF EXISTS bucket;
