databaseChangeLog:
  - changeSet:
      id: 012-create-project-holidays
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.project_holidays (
                project_id BIGINT NOT NULL REFERENCES task_management.projects(id) ON DELETE CASCADE,
                holiday_date DATE NOT NULL,
                PRIMARY KEY (project_id, holiday_date)
              );
              CREATE INDEX project_holidays_project_idx ON task_management.project_holidays(project_id);
      rollback:
        - sql:
            sql: DROP TABLE task_management.project_holidays;
