databaseChangeLog:
  - changeSet:
      id: 021-create-project-member-breaks
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.project_member_breaks (
                project_id BIGINT NOT NULL REFERENCES task_management.projects(id) ON DELETE CASCADE,
                user_id BIGINT NOT NULL REFERENCES task_management.users(id) ON DELETE CASCADE,
                start_time TIME NOT NULL,
                end_time TIME NOT NULL,
                PRIMARY KEY (project_id, user_id, start_time),
                CONSTRAINT project_member_breaks_order CHECK (start_time < end_time)
              );
              CREATE INDEX project_member_breaks_project_idx
                ON task_management.project_member_breaks(project_id);
      rollback:
        - sql:
            sql: DROP TABLE task_management.project_member_breaks;
