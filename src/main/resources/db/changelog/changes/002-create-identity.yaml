databaseChangeLog:
  - changeSet:
      id: 002-create-identity
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.users (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                username VARCHAR(50) NOT NULL,
                email VARCHAR(254) NOT NULL,
                password_hash VARCHAR(255) NOT NULL,
                first_name VARCHAR(100) NOT NULL,
                last_name VARCHAR(100) NOT NULL,
                role VARCHAR(10) NOT NULL,
                version BIGINT NOT NULL DEFAULT 0,
                credential_version BIGINT NOT NULL DEFAULT 0,
                CONSTRAINT users_username_unique UNIQUE (username),
                CONSTRAINT users_email_unique UNIQUE (email),
                CONSTRAINT users_role_check CHECK (role IN ('USER', 'ADMIN')),
                CONSTRAINT users_username_normalized CHECK (username = LOWER(TRIM(username))),
                CONSTRAINT users_email_normalized CHECK (email = LOWER(TRIM(email)))
              );
              CREATE TABLE task_management.identity_sessions (
                id UUID PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES task_management.users(id),
                token_hash VARCHAR(64) NOT NULL UNIQUE,
                expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
                revoked BOOLEAN NOT NULL DEFAULT FALSE,
                version BIGINT NOT NULL DEFAULT 0
              );
              CREATE INDEX identity_sessions_user_idx ON task_management.identity_sessions(user_id);
              CREATE TABLE task_management.identity_bootstrap_lock (
                id INTEGER PRIMARY KEY CHECK (id = 1)
              );
              INSERT INTO task_management.identity_bootstrap_lock (id) VALUES (1);
      rollback:
        - sql:
            sql: |
              DROP TABLE task_management.identity_sessions;
              DROP TABLE task_management.identity_bootstrap_lock;
              DROP TABLE task_management.users;
