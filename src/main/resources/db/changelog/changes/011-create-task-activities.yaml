databaseChangeLog:
  - changeSet:
      id: 011-create-task-activities
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.task_activities (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                actor_id BIGINT NOT NULL REFERENCES task_management.users(id),
                action_type VARCHAR(100) NOT NULL,
                summary VARCHAR(500) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT task_activities_task_fk FOREIGN KEY (project_id, task_id)
                  REFERENCES task_management.tasks(project_id, id) ON DELETE CASCADE,
                CONSTRAINT task_activities_summary_check CHECK (LENGTH(TRIM(summary)) > 0)
              );
              CREATE INDEX task_activities_task_idx ON task_management.task_activities(task_id, id DESC);
      rollback:
        - sql:
            sql: DROP TABLE task_management.task_activities;
