databaseChangeLog:
  - changeSet:
      id: 009-create-attachments
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.attachments (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                uploader_id BIGINT NOT NULL REFERENCES task_management.users(id),
                file_name VARCHAR(255) NOT NULL,
                content_type VARCHAR(100) NOT NULL,
                size_bytes BIGINT NOT NULL,
                storage_key VARCHAR(64) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT attachments_task_fk FOREIGN KEY (project_id, task_id)
                  REFERENCES task_management.tasks(project_id, id) ON DELETE CASCADE,
                CONSTRAINT attachments_file_name_check CHECK (LENGTH(TRIM(file_name)) > 0),
                CONSTRAINT attachments_size_check CHECK (size_bytes > 0 AND size_bytes <= 5242880),
                CONSTRAINT attachments_storage_key_unique UNIQUE (storage_key)
              );
              CREATE INDEX attachments_task_idx ON task_management.attachments(task_id, id);
              CREATE INDEX attachments_uploader_idx ON task_management.attachments(uploader_id);
      rollback:
        - sql:
            sql: DROP TABLE task_management.attachments;
