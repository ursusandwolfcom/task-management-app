databaseChangeLog:
  - changeSet:
      id: 025-outbox-retry-timing
      author: task-management
      changes:
        - sql:
            sql: |
              ALTER TABLE task_management.outbox_messages ADD COLUMN in_app_failures INTEGER NOT NULL DEFAULT 0;
              ALTER TABLE task_management.outbox_messages ADD COLUMN email_failures INTEGER NOT NULL DEFAULT 0;
              ALTER TABLE task_management.outbox_messages ADD COLUMN telegram_failures INTEGER NOT NULL DEFAULT 0;
              ALTER TABLE task_management.outbox_messages ADD COLUMN in_app_next_attempt_at TIMESTAMP WITH TIME ZONE NULL;
              ALTER TABLE task_management.outbox_messages ADD COLUMN email_next_attempt_at TIMESTAMP WITH TIME ZONE NULL;
              ALTER TABLE task_management.outbox_messages ADD COLUMN telegram_next_attempt_at TIMESTAMP WITH TIME ZONE NULL;
      rollback:
        - sql:
            sql: |
              ALTER TABLE task_management.outbox_messages DROP COLUMN in_app_failures;
              ALTER TABLE task_management.outbox_messages DROP COLUMN email_failures;
              ALTER TABLE task_management.outbox_messages DROP COLUMN telegram_failures;
              ALTER TABLE task_management.outbox_messages DROP COLUMN in_app_next_attempt_at;
              ALTER TABLE task_management.outbox_messages DROP COLUMN email_next_attempt_at;
              ALTER TABLE task_management.outbox_messages DROP COLUMN telegram_next_attempt_at;
