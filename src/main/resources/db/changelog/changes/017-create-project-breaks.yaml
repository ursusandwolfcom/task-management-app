databaseChangeLog:
  - changeSet:
      id: 017-create-project-breaks
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.project_breaks (
                project_id BIGINT NOT NULL REFERENCES task_management.projects(id) ON DELETE CASCADE,
                start_time TIME NOT NULL,
                end_time TIME NOT NULL,
                PRIMARY KEY (project_id, start_time),
                CONSTRAINT project_breaks_order CHECK (start_time < end_time)
              );
              CREATE INDEX project_breaks_project_idx ON task_management.project_breaks(project_id);
      rollback:
        - sql:
            sql: DROP TABLE task_management.project_breaks;
