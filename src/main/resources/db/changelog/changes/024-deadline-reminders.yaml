databaseChangeLog:
  - changeSet:
      id: 024-deadline-reminders
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.deadline_reminders (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                task_id BIGINT NOT NULL REFERENCES task_management.tasks(id) ON DELETE CASCADE,
                due_date DATE NOT NULL,
                recipient_id BIGINT NOT NULL REFERENCES task_management.users(id),
                kind VARCHAR(16) NOT NULL,
                CONSTRAINT deadline_reminders_key UNIQUE (task_id, due_date, recipient_id, kind)
              );
              ALTER TABLE task_management.email_digest_entries ADD COLUMN outbox_message_id BIGINT NULL;
      rollback:
        - sql:
            sql: |
              ALTER TABLE task_management.email_digest_entries DROP COLUMN outbox_message_id;
              DROP TABLE task_management.deadline_reminders;
