databaseChangeLog:
  - changeSet:
      id: 022-user-mega-links
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.user_mega_links (
                user_id BIGINT PRIMARY KEY REFERENCES task_management.users(id) ON DELETE CASCADE,
                account_id VARCHAR(64) NOT NULL,
                encrypted_session VARCHAR(4096) NOT NULL,
                folder_handle VARCHAR(64) NOT NULL,
                linked_at TIMESTAMP WITH TIME ZONE NOT NULL,
                version BIGINT NOT NULL DEFAULT 0
              );
      rollback:
        - sql:
            sql: DROP TABLE task_management.user_mega_links;
