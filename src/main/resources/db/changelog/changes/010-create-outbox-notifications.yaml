databaseChangeLog:
  - changeSet:
      id: 010-create-outbox-notifications
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.outbox_messages (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                event_type VARCHAR(100) NOT NULL,
                payload VARCHAR(4000) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                processed_at TIMESTAMP WITH TIME ZONE
              );
              CREATE INDEX outbox_unprocessed_idx ON task_management.outbox_messages(processed_at, id);

              CREATE TABLE task_management.notifications (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                user_id BIGINT NOT NULL REFERENCES task_management.users(id),
                event_type VARCHAR(100) NOT NULL,
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                title VARCHAR(200) NOT NULL,
                body VARCHAR(1000) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                read_at TIMESTAMP WITH TIME ZONE,
                CONSTRAINT notifications_title_check CHECK (LENGTH(TRIM(title)) > 0),
                CONSTRAINT notifications_body_check CHECK (LENGTH(TRIM(body)) > 0)
              );
              CREATE INDEX notifications_user_idx ON task_management.notifications(user_id, id DESC);
              CREATE INDEX notifications_user_unread_idx ON task_management.notifications(user_id, read_at, id DESC);
      rollback:
        - sql:
            sql: |
              DROP TABLE task_management.notifications;
              DROP TABLE task_management.outbox_messages;
