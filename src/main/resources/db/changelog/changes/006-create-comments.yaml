databaseChangeLog:
  - changeSet:
      id: 006-create-comments
      author: task-management
      changes:
        - sql:
            sql: |
              CREATE TABLE task_management.comments (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                project_id BIGINT NOT NULL,
                task_id BIGINT NOT NULL,
                author_id BIGINT NOT NULL REFERENCES task_management.users(id),
                text VARCHAR(10000) NOT NULL,
                created_at TIMESTAMP WITH TIME ZONE NOT NULL,
                CONSTRAINT comments_task_fk FOREIGN KEY (project_id, task_id)
                  REFERENCES task_management.tasks(project_id, id) ON DELETE CASCADE,
                CONSTRAINT comments_text_check CHECK (LENGTH(TRIM(text)) > 0)
              );
              CREATE INDEX comments_task_idx ON task_management.comments(task_id, id);
              CREATE INDEX comments_author_idx ON task_management.comments(author_id);
      rollback:
        - sql:
            sql: DROP TABLE task_management.comments;
