databaseChangeLog:
  - changeSet:
      id: 005-index-project-graph
      author: task-management
      changes:
        - createIndex:
            indexName: dependencies_project_graph_idx
            schemaName: task_management
            tableName: task_dependencies
            columns:
              - column:
                  name: project_id
              - column:
                  name: task_id
              - column:
                  name: depends_on_task_id
      rollback:
        - dropIndex:
            indexName: dependencies_project_graph_idx
            schemaName: task_management
            tableName: task_dependencies
